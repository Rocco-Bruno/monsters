<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monsters city</title>
    <link rel="stylesheet" href="inicio.css">
</head>

<body>

    <main class="pantalla-inicio">
        <div class="menu">
            <a href="../mapa/mapa.html" class="boton" id="boton-play">Play</a>
            <button class="boton" id="boton-configuracion">Configuración</button>
            <button class="boton" id="boton-salir">Salir</button>
        </div>
    </main>

    <!--ventana para poner el nombre del jugador al tocar Play (inicio.js)-->
    <div id="ventana-nombre">
        <form class="caja-nombre" id="form-nombre">
            <h2>¿Cómo te llamás?</h2>
            <p>Este nombre se va a ver en tu perfil.</p>
            <input type="text" id="input-nombre" maxlength="16" placeholder="Tu nombre" autocomplete="off">
            <p class="error" id="error-nombre"></p>
            <div class="botones-nombre">
                <button type="button" class="boton" id="boton-cancelar">Cancelar</button>
                <button type="submit" class="boton" id="boton-empezar">Jugar</button>
            </div>
        </form>
    </div>

    <script src="inicio.js"></script>

</body>
</html>
