
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Monster World</title>
    <link rel="stylesheet" href="perfil.css">
</head>

<body>

    <!--barra de arriba: volver al mapa (la partida queda guardada) y las gemas para comprar marcos-->
    <div class="barra-superior">
        <a href="../mapa/mapa.html" class="boton volver">⬅ VOLVER AL JUEGO</a>
        <span class="gemas" id="gemas-perfil">💎 0</span>
    </div>

    <main>

        <section class="perfil">

            <div class="tarjeta-perfil">

                <div class="datos-jugador">

                    <!--avatar: el monstruo que elijas en tu colección (perfil.js); el borde es el marco puesto-->
                    <div class="avatar" id="avatar"></div>

                    <div class="informacion">
                        <!--el rango sale del nivel (ver rangos en mapa/experiencia.js)-->
                        <p class="etiqueta" id="rango-perfil">Principiante</p>
                        <h2 id="nombre-jugador">MonsterPlayer</h2>
                        <span class="nivel" id="nivel-perfil">NIVEL 01</span>
                    </div>

                </div>

                <div class="experiencia">
                    <div class="texto-experiencia">
                        <span>EXPERIENCIA</span>
                        <span id="texto-xp-perfil">0 / 100 XP</span>
                    </div>

                    <div class="barra">
                        <div class="progreso" id="barra-xp-perfil"></div>
                    </div>
                </div>

                <div class="detalles">
                    <div class="detalle">
                        <span class="numero" id="total-monstruos">00</span>
                        <span class="nombre">MONSTRUOS</span>
                    </div>

                    <div class="detalle">
                        <span class="numero" id="total-huevos">00</span>
                        <span class="nombre">HUEVOS</span>
                    </div>

                    <div class="detalle">
                        <span class="numero" id="total-logros">00</span>
                        <span class="nombre">LOGROS</span>
                    </div>
                </div>

            </div>

            <!--marcos para el avatar, se compran con gemas (perfil.js)-->
            <div class="caja">
                <h3>MARCOS</h3>
                <p class="objetivo">Comprá marcos con gemas y elegí cuál usar. Para cambiar tu avatar, tocá "Usar de avatar" en un monstruo de tu colección.</p>
                <div id="lista-marcos"></div>
            </div>

        </section>

        <section class="coleccion">

            <div class="encabezado-coleccion">
                <h2>MI COLECCIÓN</h2>
                <span class="contador" id="contador-coleccion">0 / 14</span>
            </div>

            <!--perfil.js pone aca todos los mounstruos del juego (los que no conseguiste salen como ???)-->
            <div class="contenedor-monstruos" id="contenedor-monstruos"></div>

        </section>

    </main>

    <script src="../mapa/iconos-recursos.js"></script>
    <script src="../mapa/datos-monstruos.js"></script>
    <script src="../mapa/experiencia.js"></script>
    <script src="perfil.js"></script>

</body>
</html>
